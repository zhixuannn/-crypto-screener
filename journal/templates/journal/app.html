<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#081B2E">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>XUAN 交易日誌</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{{ url_for('journal.static', filename='journal.css') }}?v={{ v }}">
</head>
<body>
<div class="app">
  <aside class="side" id="side">
    <div class="side-top">
      <a class="brand" href="#/overview">
        <span class="brand-mark" aria-hidden="true"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4 18 L9 12 L13 15 L20 6"/><path d="M15 6 H20 V11"/></svg></span>
        <span class="brand-name">XUAN 交易日誌</span>
      </a>
      <button class="menu-btn" id="menuBtn" type="button" aria-label="開啟選單" aria-expanded="false"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
    </div>
    <nav class="nav" id="nav" aria-label="主選單"></nav>
    <div class="side-bottom">
      <div class="me"><span id="meName">Zhixuan</span><a href="/journal/logout" class="logout" aria-label="登出" title="登出"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="M16 17l5-5-5-5"/><path d="M21 12H9"/></svg></a></div>
    </div>
  </aside>
  <main class="main" id="main" tabindex="-1"><div class="page"><div class="loading">載入中…</div></div></main>
</div>
<div id="layer"></div>
{% for f in ['core.js', 'pages.js', 'analytics.js', 'perf.js', 'settings.js'] %}<script src="{{ url_for('journal.static', filename=f) }}?v={{ v }}"></script>
{% endfor %}
</body>
</html>
