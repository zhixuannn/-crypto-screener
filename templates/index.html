<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>XUAN 3+1 訊號掃描</title>
    <script src="https://s3.tradingview.com/tv.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; }
        :root {
            --bg: #0a0a0d;
            --panel: #121319;
            --panel-alt: #17181f;
            --border: #24262e;
            --gold: #b8902f;
            --gold-bright: #e0b64f;
            --text: #ecebe6;
            --text-dim: #8b8d95;
            --long: #35b37e;
            --short: #e5484d;
        }
        body {
            font-family: 'IBM Plex Sans', -apple-system, "Microsoft JhengHei", sans-serif;
            background: var(--bg);
            color: var(--text);
            margin: 0;
            display: flex;
            min-height: 100vh;
        }
        .mono { font-family: 'IBM Plex Mono', monospace; }

        .sidebar { width: 168px; flex-shrink: 0; background: var(--panel); border-right: 1px solid var(--border); padding: 22px 14px; transition: width 0.2s, padding 0.2s; overflow: hidden; }
        .sidebar.collapsed { width: 0; padding: 22px 0; border-right: none; }
        .sidebar-inner { width: 140px; }
        .sidebar h1 { font-size: 15px; font-weight: 600; color: var(--gold-bright); margin: 0 0 4px; padding: 0 8px; }
        .sidebar .sub { color: var(--text-dim); font-size: 11px; margin: 0 0 20px; padding: 0 8px; }
        .nav-item { display: block; width: 100%; text-align: left; background: none; border: none; color: var(--text-dim); font-size: 13px; font-family: inherit; padding: 9px 10px; border-radius: 4px; cursor: pointer; margin-bottom: 2px; }
        .nav-item.active { color: var(--gold-bright); background: var(--panel-alt); }
        .nav-item:hover:not(.active) { color: var(--text); }

        .main { flex: 1; padding: 28px 24px 60px; min-width: 0; position: relative; }

        .sidebar-toggle {
            position: sticky; top: 0;
            background: var(--panel); border: 1px solid var(--border); color: var(--text-dim);
            border-radius: 4px; padding: 6px 9px; cursor: pointer; font-size: 13px;
            margin-bottom: 16px; display: inline-block;
        }
        .sidebar-toggle:hover { color: var(--gold-bright); border-color: var(--gold); }

        .section-head { position: relative; padding-left: 14px; margin: 32px 0 14px; font-size: 14px; font-weight: 600; color: var(--text); display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 8px; }
        .section-head:first-child { margin-top: 0; }
        .section-head::before { content: ''; position: absolute; left: 0; top: 2px; bottom: 2px; width: 3px; background: var(--gold); }
        .section-head .count { color: var(--text-dim); font-weight: 400; font-size: 12px; margin-left: 8px; }
        .panel { background: var(--panel); border: 1px solid var(--border); border-radius: 6px; padding: 18px 20px; }
        #tv_chart { border-radius: 4px; overflow: hidden; }
        #chartPanel { scroll-margin-top: 20px; }

        .filter-input { background: var(--panel-alt); color: var(--text); border: 1px solid var(--border); border-radius: 4px; padding: 7px 12px; font-size: 13px; outline: none; width: 200px; }
        .filter-input::placeholder { color: var(--text-dim); }

        .range-bar { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
        .range-btn { background: var(--panel-alt); color: var(--text-dim); border: 1px solid var(--border); border-radius: 4px; padding: 5px 12px; font-size: 12px; cursor: pointer; }
        .range-btn.active { color: var(--gold-bright); border-color: var(--gold); }
        .range-bar input[type="date"] { background: var(--panel-alt); color: var(--text); border: 1px solid var(--border); border-radius: 4px; padding: 4px 8px; font-size: 12px; display: none; }
        .range-bar.custom-mode input[type="date"] { display: inline-block; }

        .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 1px; background: var(--border); border: 1px solid var(--border); border-radius: 4px; overflow: hidden; }
        .stat-box { background: var(--panel); padding: 16px 18px; text-align: center; }
        .stat-label { font-size: 11px; color: var(--text-dim); margin-bottom: 8px; }
        .stat-value { font-size: 22px; font-weight: 600; }
        .stat-value.pos { color: var(--long); }
        .stat-value.neg { color: var(--short); }

        .signal-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 12px; }
        .signal-card { background: var(--panel); border: 1px solid var(--border); border-left: 3px solid var(--long); border-radius: 3px; padding: 14px 16px; }
        .signal-card.short { border-left-color: var(--short); }
        .sc-top { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 12px; }
        .sc-name-group { display: flex; align-items: center; gap: 6px; }
        .sc-symbol { font-size: 15px; font-weight: 600; cursor: pointer; }
        .sc-symbol:hover { color: var(--gold-bright); }
        .tv-btn {
            font-size: 10px; font-weight: 600; color: var(--text-dim);
            border: 1px solid var(--border); border-radius: 3px; padding: 1px 5px; cursor: pointer;
        }
        .tv-btn:hover { color: var(--gold-bright); border-color: var(--gold); }
        .sc-dir { font-size: 12px; font-weight: 600; }
        .sc-dir.long { color: var(--long); }
        .sc-dir.short { color: var(--short); }

        .price-boxes { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin-bottom: 10px; }
        .price-box { border: 1px solid var(--border); border-radius: 3px; padding: 6px 4px; text-align: center; }
        .price-box .pb-label { font-size: 10px; color: var(--text-dim); margin-bottom: 3px; }
        .price-box .pb-value { font-size: 12px; font-weight: 600; }
        .price-box.entry { border-color: var(--gold); }
        .price-box.sl .pb-value { color: var(--short); }
        .price-box.tp .pb-value { color: var(--long); }

        .live-pct-row { display: flex; justify-content: space-between; align-items: center; font-size: 12px; color: var(--text-dim); margin-bottom: 8px; }
        .live-pct-row .live-val { font-weight: 600; }
        .live-pct-row .live-val.pos { color: var(--long); }
        .live-pct-row .live-val.neg { color: var(--short); }

        .sc-status-row { display: flex; align-items: center; gap: 5px; font-size: 12px; color: var(--text-dim); padding-top: 8px; border-top: 1px solid var(--border); }
        .status-dot { width: 6px; height: 6px; border-radius: 1px; background: var(--gold); }
        .status-dot.win { background: var(--long); }
        .status-dot.loss { background: var(--short); }

        .closed-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 10px; }
        .closed-card { background: var(--panel); border: 1px solid var(--border); border-radius: 3px; padding: 10px 14px; display: flex; align-items: center; justify-content: space-between; gap: 8px; }
        .cc-left { display: flex; align-items: center; gap: 6px; }
        .cc-symbol { font-size: 13px; font-weight: 600; cursor: pointer; }
        .cc-symbol:hover { color: var(--gold-bright); }
        .cc-dir { font-size: 11px; }
        .cc-dir.long { color: var(--long); }
        .cc-dir.short { color: var(--short); }
        .cc-right { text-align: right; }
        .cc-r { font-size: 13px; font-weight: 600; }
        .cc-r.pos { color: var(--long); }
        .cc-r.neg { color: var(--short); }
        .cc-time { font-size: 10px; color: var(--text-dim); }

        .empty { color: var(--text-dim); padding: 24px 0; text-align: center; font-size: 13px; }
        table { width: 100%; border-collapse: collapse; }
        th, td { text-align: left; padding: 9px 10px; border-bottom: 1px solid var(--border); font-size: 13px; }
        th { color: var(--text-dim); font-weight: 500; font-size: 11px; }
        .pos-text { color: var(--long); }
        .neg-text { color: var(--short); }

        details.panel summary { cursor: pointer; list-style: none; font-size: 13px; color: var(--text-dim); display: flex; justify-content: space-between; }
        details.panel summary::-webkit-details-marker { display: none; }
        details.panel summary b { color: var(--text); }
        .symbol-tags { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 14px; }
        .symbol-tag { background: var(--panel-alt); border: 1px solid var(--border); color: var(--text-dim); font-size: 11px; padding: 4px 10px; border-radius: 3px; cursor: pointer; }
        .symbol-tag:hover { color: var(--gold-bright); border-color: var(--gold); }
    </style>
</head>
<body>
    <div class="sidebar" id="sidebar">
        <div class="sidebar-inner">
            <h1>XUAN 3+1</h1>
            <div class="sub">週期 {{ timeframe }}</div>
            <button class="nav-item active" data-page="overview">總覽</button>
            <button class="nav-item" data-page="stats">統計</button>
        </div>
    </div>

    <div class="main">
        <button class="sidebar-toggle" id="sidebarToggle">☰</button>

        <div id="pageOverview">
            <div class="panel" id="chartPanel">
                <div id="tv_chart"></div>
            </div>

            <div class="section-head">
                訊號
                <input type="text" class="filter-input" id="symbolFilter" placeholder="搜尋幣種，例如 BTC">
            </div>

            <div class="section-head" style="margin-top: 20px;">未結單<span class="count" id="openCount">0 筆</span></div>
            <div id="openSignalsBox"><div class="panel"><div class="empty">載入中...</div></div></div>

            <div class="section-head">已結單<span class="count" id="closedCount">0 筆</span></div>
            <div id="closedSignalsBox"><div class="panel"><div class="empty">載入中...</div></div></div>

            <details class="panel" style="margin-top: 32px;">
                <summary>
                    <span><b id="scanCountLabel">目前掃描中：- 個幣種</b>　點開查看清單，點幣種可切換圖表</span>
                    <span id="scanUpdatedLabel"></span>
                </summary>
                <div class="symbol-tags" id="scanTagsBox"></div>
            </details>
        </div>

        <div id="pageStats" style="display: none;">
            <div class="section-head">
                整體績效<span class="count">僅計入已平倉訊號</span>
                <div class="range-bar" id="rangeBar">
                    <button class="range-btn active" data-range="today">今天</button>
                    <button class="range-btn" data-range="7d">近7天</button>
                    <button class="range-btn" data-range="30d">近30天</button>
                    <button class="range-btn" data-range="all">全部</button>
                    <button class="range-btn" data-range="custom">自訂</button>
                    <input type="date" id="rangeStart">
                    <input type="date" id="rangeEnd">
                </div>
            </div>
            <div class="stats-grid">
                <div class="stat-box"><div class="stat-label">已平倉訊號數</div><div class="stat-value mono" id="statTotal">-</div></div>
                <div class="stat-box"><div class="stat-label">勝率</div><div class="stat-value mono" id="statWinRate">-</div></div>
                <div class="stat-box"><div class="stat-label">總R數</div><div class="stat-value mono" id="statR">-</div></div>
            </div>

            <div class="section-head">分幣種績效</div>
            <div class="panel" id="perSymbolBox"><div class="empty">載入中...</div></div>
        </div>
    </div>

    <script>
        var currentRange = 'today';
        var lastData = null;
        var knownOpenSignalIds = null;

        document.getElementById('sidebarToggle').addEventListener('click', function() {
            var sb = document.getElementById('sidebar');
            sb.classList.toggle('collapsed');
            localStorage.setItem('sidebarCollapsed', sb.classList.contains('collapsed') ? '1' : '0');
        });
        if (localStorage.getItem('sidebarCollapsed') === '1') {
            document.getElementById('sidebar').classList.add('collapsed');
        }

        var navItems = document.querySelectorAll('.nav-item');
        for (var n = 0; n < navItems.length; n++) {
            navItems[n].addEventListener('click', function() {
                for (var m = 0; m < navItems.length; m++) navItems[m].classList.remove('active');
                this.classList.add('active');
                var page = this.getAttribute('data-page');
                document.getElementById('pageOverview').style.display = page === 'overview' ? 'block' : 'none';
                document.getElementById('pageStats').style.display = page === 'stats' ? 'block' : 'none';
            });
        }

        function loadWidget(tvSymbol) {
            document.getElementById('tv_chart').innerHTML = '';
            new TradingView.widget({
                "width": "100%",
                "height": 460,
                "symbol": tvSymbol,
                "interval": "60",
                "timezone": "Asia/Taipei",
                "theme": "dark",
                "style": "1",
                "locale": "zh_TW",
                "toolbar_bg": "#121319",
                "enable_publishing": false,
                "hide_top_toolbar": false,
                "allow_symbol_change": true,
                "container_id": "tv_chart"
            });
        }
        loadWidget('BINGX:BTCUSDT.P');

        function symbolToTv(fullSymbol) {
            var base = fullSymbol.split('/')[0];
            return 'BINGX:' + base + 'USDT.P';
        }

        function jumpToChart(fullSymbol) {
            loadWidget(symbolToTv(fullSymbol));
            var page = document.querySelector('.nav-item[data-page="overview"]');
            if (page && !page.classList.contains('active')) page.click();
            document.getElementById('chartPanel').scrollIntoView({ behavior: 'smooth', block: 'start' });
        }

        function escapeHtml(str) {
            return String(str).replace(/[&<>"']/g, function(c) {
                var map = {'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'};
                return map[c];
            });
        }

        function formatPrice(price) {
            if (price == null) return '-';
            var num = Number(price);
            if (isNaN(num)) return price;
            var decimals;
            if (num >= 100) decimals = 2;
            else if (num >= 1) decimals = 4;
            else if (num >= 0.01) decimals = 6;
            else decimals = 8;
            var fixed = num.toFixed(decimals);
            return parseFloat(fixed).toString();
        }

        function requestNotifyPermission() {
            if ('Notification' in window && Notification.permission === 'default') {
                Notification.requestPermission();
            }
        }
        requestNotifyPermission();

        function notifyNewSignals(openSignals) {
            if (!('Notification' in window) || Notification.permission !== 'granted') return;
            var currentIds = {};
            for (var i = 0; i < openSignals.length; i++) currentIds[openSignals[i].id] = true;

            if (knownOpenSignalIds !== null) {
                for (var i = 0; i < openSignals.length; i++) {
                    var s = openSignals[i];
                    if (!knownOpenSignalIds[s.id]) {
                        var dirLabel = s.direction === 'long' ? '做多' : '做空';
                        try {
                            new Notification('新訊號: ' + s.base_symbol, {
                                body: dirLabel + ' @ ' + s.entry_price,
                                tag: 'signal-' + s.id
                            });
                        } catch (e) { console.error('通知發送失敗', e); }
                    }
                }
            }
            knownOpenSignalIds = currentIds;
        }

        function tvButtonHtml(fullSymbol) {
            return '<span class="tv-btn" data-symbol="' + escapeHtml(fullSymbol) + '">TV</span>';
        }

        function openCardHtml(s) {
            var dirClass = s.direction === 'short' ? 'short' : '';
            var dirLabel = s.direction === 'long' ? '做多' : '做空';
            var tpHtml = '<div class="price-box tp"><div class="pb-label">TP</div><div class="pb-value mono">' + formatPrice(s.tp_price) + '</div></div>';
            var liveHtml = '';
            if (s.live_pct != null) {
                var liveClass = s.live_pct >= 0 ? 'pos' : 'neg';
                var liveSign = s.live_pct >= 0 ? '+' : '';
                liveHtml = '<div class="live-pct-row"><span>目前實盤</span><span class="live-val mono ' + liveClass + '">' + liveSign + s.live_pct.toFixed(2) + '%</span></div>';
            }
            return '<div class="signal-card ' + dirClass + '">' +
                        '<div class="sc-top">' +
                            '<div class="sc-name-group">' +
                                '<span class="sc-symbol" data-symbol="' + escapeHtml(s.symbol) + '">' + escapeHtml(s.base_symbol) + '</span>' +
                                tvButtonHtml(s.symbol) +
                            '</div>' +
                            '<span class="sc-dir ' + s.direction + '">' + dirLabel + '</span>' +
                        '</div>' +
                        '<div class="price-boxes">' +
                            '<div class="price-box entry"><div class="pb-label">進場</div><div class="pb-value mono">' + formatPrice(s.entry_price) + '</div></div>' +
                            '<div class="price-box sl"><div class="pb-label">SL</div><div class="pb-value mono">' + formatPrice(s.sl_price) + '</div></div>' +
                            tpHtml +
                        '</div>' +
                        liveHtml +
                        '<div class="sc-status-row"><span class="status-dot"></span>追蹤中　' + s.ago_str + '</div>' +
                    '</div>';
        }

        function closedCardHtml(s) {
            var dirClass = s.direction === 'short' ? 'short' : '';
            var dirLabel = s.direction === 'long' ? '做多' : '做空';
            var win = s.status === 'tp_hit';
            var r = win ? 1 : -1;
            var rClass = r >= 0 ? 'pos' : 'neg';
            var rSign = r >= 0 ? '+' : '';
            return '<div class="closed-card">' +
                        '<div class="cc-left">' +
                            '<span class="status-dot ' + (win ? 'win' : 'loss') + '"></span>' +
                            '<span class="cc-symbol" data-symbol="' + escapeHtml(s.symbol) + '">' + escapeHtml(s.base_symbol) + '</span>' +
                            tvButtonHtml(s.symbol) +
                            '<span class="cc-dir ' + dirClass + '">' + dirLabel + '</span>' +
                        '</div>' +
                        '<div class="cc-right">' +
                            '<div class="cc-r mono ' + rClass + '">' + rSign + r.toFixed(1) + 'R</div>' +
                            '<div class="cc-time">' + s.ago_str + '</div>' +
                        '</div>' +
                    '</div>';
        }

        function bindSymbolClicks(container) {
            var els = container.querySelectorAll('[data-symbol]');
            for (var i = 0; i < els.length; i++) {
                els[i].addEventListener('click', function() {
                    jumpToChart(this.getAttribute('data-symbol'));
                });
            }
        }

        function renderOpenSignals(list) {
            var box = document.getElementById('openSignalsBox');
            document.getElementById('openCount').textContent = list.length + ' 筆';
            if (!list.length) {
                box.innerHTML = '<div class="panel"><div class="empty">目前沒有追蹤中的訊號</div></div>';
                return;
            }
            var html = '<div class="signal-grid">';
            for (var i = 0; i < list.length; i++) html += openCardHtml(list[i]);
            html += '</div>';
            box.innerHTML = html;
            bindSymbolClicks(box);
        }

        function renderClosedSignals(list) {
            var box = document.getElementById('closedSignalsBox');
            document.getElementById('closedCount').textContent = list.length + ' 筆';
            if (!list.length) {
                box.innerHTML = '<div class="panel"><div class="empty">還沒有已結束的訊號</div></div>';
                return;
            }
            var html = '<div class="closed-grid">';
            for (var i = 0; i < list.length; i++) html += closedCardHtml(list[i]);
            html += '</div>';
            box.innerHTML = html;
            bindSymbolClicks(box);
        }

        function applySymbolFilter() {
            if (!lastData) return;
            var q = document.getElementById('symbolFilter').value.trim().toUpperCase();
            var openList = lastData.open_signals;
            var closedList = lastData.closed_signals;
            if (q) {
                openList = openList.filter(function(s) { return s.base_symbol.toUpperCase().indexOf(q) !== -1; });
                closedList = closedList.filter(function(s) { return s.base_symbol.toUpperCase().indexOf(q) !== -1; });
            }
            renderOpenSignals(openList);
            renderClosedSignals(closedList);
        }

        function renderPerSymbol(list) {
            var box = document.getElementById('perSymbolBox');
            if (!list.length) {
                box.innerHTML = '<div class="empty">還沒有已平倉的訊號可以統計</div>';
                return;
            }
            var rows = '';
            for (var i = 0; i < list.length; i++) {
                var row = list[i];
                rows += '<tr>' +
                            '<td>' + escapeHtml(row.symbol) + '</td>' +
                            '<td class="mono">' + row.total + '</td>' +
                            '<td class="mono ' + (row.win_rate >= 50 ? 'pos-text' : 'neg-text') + '">' + row.win_rate.toFixed(1) + '%</td>' +
                            '<td class="mono ' + (row.r >= 0 ? 'pos-text' : 'neg-text') + '">' + row.r.toFixed(2) + 'R</td>' +
                        '</tr>';
            }
            box.innerHTML = '<table><thead><tr><th>幣種</th><th>已平倉訊號數</th><th>勝率</th><th>總R數</th></tr></thead><tbody>' + rows + '</tbody></table>';
        }

        function renderStats(overall, perSymbol) {
            document.getElementById('statTotal').textContent = overall.total;
            var winRateEl = document.getElementById('statWinRate');
            winRateEl.textContent = overall.win_rate.toFixed(1) + '%';
            winRateEl.className = 'stat-value mono ' + (overall.win_rate >= 50 ? 'pos' : 'neg');
            var rEl = document.getElementById('statR');
            rEl.textContent = overall.total_r.toFixed(2) + 'R';
            rEl.className = 'stat-value mono ' + (overall.total_r >= 0 ? 'pos' : 'neg');
            renderPerSymbol(perSymbol);
        }

        function renderScanList(data) {
            document.getElementById('scanCountLabel').textContent = '目前掃描中：' + data.symbols_count + ' 個幣種';
            document.getElementById('scanUpdatedLabel').textContent = data.symbols_updated_str ? ('更新於 ' + data.symbols_updated_str) : '';
            var tagsBox = document.getElementById('scanTagsBox');
            if (data.scan_symbols.length) {
                var tagsHtml = '';
                for (var i = 0; i < data.scan_symbols.length; i++) {
                    var sym = data.scan_symbols[i];
                    var tv = data.tv_symbol_map[sym];
                    tagsHtml += '<span class="symbol-tag" data-tv="' + escapeHtml(tv) + '">' + escapeHtml(sym) + '</span>';
                }
                tagsBox.innerHTML = tagsHtml;
                var tagEls = tagsBox.querySelectorAll('.symbol-tag');
                for (var j = 0; j < tagEls.length; j++) {
                    tagEls[j].addEventListener('click', function() {
                        var tv = this.getAttribute('data-tv');
                        if (tv) {
                            loadWidget(tv);
                            document.getElementById('chartPanel').scrollIntoView({ behavior: 'smooth', block: 'start' });
                        }
                    });
                }
            } else {
                tagsBox.innerHTML = '<div class="empty">名單還沒抓到，稍等下一輪掃描</div>';
            }
        }

        function buildQueryString() {
            if (currentRange === 'custom') {
                var s = document.getElementById('rangeStart').value;
                var e = document.getElementById('rangeEnd').value;
                var qs = 'range=custom';
                if (s) qs += '&start=' + s;
                if (e) qs += '&end=' + e;
                return qs;
            }
            return 'range=' + currentRange;
        }

        function fetchAndRender() {
            fetch('/api/data?' + buildQueryString())
                .then(function(res) { return res.json(); })
                .then(function(data) {
                    lastData = data;
                    notifyNewSignals(data.open_signals);
                    applySymbolFilter();
                    renderStats(data.overall_stats, data.per_symbol_stats);
                    renderScanList(data);
                })
                .catch(function(err) { console.error('資料更新失敗:', err); });
        }

        document.getElementById('symbolFilter').addEventListener('input', applySymbolFilter);

        var rangeButtons = document.querySelectorAll('.range-btn');
        for (var i = 0; i < rangeButtons.length; i++) {
            rangeButtons[i].addEventListener('click', function() {
                for (var j = 0; j < rangeButtons.length; j++) rangeButtons[j].classList.remove('active');
                this.classList.add('active');
                currentRange = this.getAttribute('data-range');
                var bar = document.getElementById('rangeBar');
                if (currentRange === 'custom') bar.classList.add('custom-mode');
                else bar.classList.remove('custom-mode');
                fetchAndRender();
            });
        }
        document.getElementById('rangeStart').addEventListener('change', function() { if (currentRange === 'custom') fetchAndRender(); });
        document.getElementById('rangeEnd').addEventListener('change', function() { if (currentRange === 'custom') fetchAndRender(); });

        fetchAndRender();
        setInterval(fetchAndRender, 60000);
    </script>
</body>
</html>
